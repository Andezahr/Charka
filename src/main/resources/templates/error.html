<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle} ?: 'Ошибка'">Ошибка</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 600px;
            text-align: center;
        }

        .error-icon {
            font-size: 4rem;
            color: #6c757d;
            margin-bottom: 1.5rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-title {
            color: #495057;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .error-message {
            color: #6c757d;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .btn-home {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }

        .error-details {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(108, 117, 125, 0.1);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="error-card">
                    <!-- Иконка ошибки -->
                    <div class="error-icon">
                        <i th:class="${errorIcon} ?: 'fas fa-exclamation-triangle'"></i>
                    </div>

                    <!-- Код ошибки -->
                    <div class="error-code" th:text="${statusCode} ?: '???'">404</div>

                    <!-- Заголовок ошибки -->
                    <h1 class="error-title h2" th:text="${errorTitle} ?: 'Произошла ошибка'">
                        Страница не найдена
                    </h1>

                    <!-- Описание ошибки -->
                    <p class="error-message" th:text="${errorMessage} ?: 'Что-то пошло не так'">
                        Запрашиваемая страница не существует или была перемещена.
                    </p>

                    <!-- Кнопки действий -->
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a href="/" class="btn btn-home">
                            <i class="fas fa-home me-2"></i>На главную
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Назад
                        </button>
                    </div>

                    <!-- Дополнительная информация (показываем только в dev режиме) -->
                    <div class="error-details" th:if="${requestUri}">
                        <small>
                            <strong>Путь:</strong> <span th:text="${requestUri}"></span><br>
                            <strong>Время:</strong> <span th:text="${#temporals.format(timestamp, 'dd.MM.yyyy HH:mm:ss')}"></span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
