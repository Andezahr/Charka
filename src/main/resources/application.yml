spring:
  application:
    name: Charka
  resources:
    cache:
      period: 0
    chain:
      cache: false
  thymeleaf:
    cache: false
  mvc:
    # позволяет HTML-формам слать DELETE через скрытое поле _method (удаление счётчиков)
    hiddenmethod:
      filter:
        enabled: true

server:
  address: 0.0.0.0
  port: 8080
logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
