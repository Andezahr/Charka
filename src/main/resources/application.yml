spring:
  application:
    name: Charka
  # PostgreSQL из compose.yaml (dev); на другом окружении — переменные DB_URL / DB_USER / DB_PASSWORD
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/charka}
    username: ${DB_USER:charka}
    password: ${DB_PASSWORD:charka_dev_pw}
  docker:
    compose:
      # контейнер не гасим при остановке приложения — данные и так в volume, а старт быстрее
      lifecycle-management: start-only
  jpa:
    # схему создаёт и меняет только Flyway (src/main/resources/db/migration), Hibernate лишь сверяет
    hibernate:
      ddl-auto: validate
  web:
    resources:
      # в адрес app.js и app.css подставляется хэш содержимого (th:src="@{...}"): после обновления браузер берёт новый файл
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  thymeleaf:
    # без кэша лист персонажа рендерится в 6 раз дольше (1,2 с против 0,2 с). Править шаблоны без перезапуска: THYMELEAF_CACHE=false
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      # подложка карты боя — до 5 МБ (M-11)
      max-file-size: 6MB
      max-request-size: 7MB
  mvc:
    # позволяет HTML-формам слать DELETE через скрытое поле _method (удаление счётчиков)
    hiddenmethod:
      filter:
        enabled: true

server:
  address: 0.0.0.0
  port: 8080
  error:
    # error.html показывает текст ошибки и для ошибок вне контроллеров (например, неизвестный URL)
    include-message: always
    include-stacktrace: never
logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO

charka:
  security:
    # U-03: вход по логину и паролю; ключ cookie «запомнить меня» — свой на каждом сервере
    enabled: ${CHARKA_SECURITY:true}
    remember-key: ${REMEMBER_KEY:charka-remember-dev}
