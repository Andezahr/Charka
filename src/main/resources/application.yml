spring:
  application:
    name: Charka
  resources:
    cache:
      period: 0
    chain:
      cache: false
  thymeleaf:
    cache: false

server:
  address: 0.0.0.0
  port: 8080
  error:
    include-stacktrace: never
  logging:
    level:
      org.springframework.web.servlet.DispatcherServlet: WARN
      org.springframework.boot.web.servlet.error: WARN
      org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN