<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!-- Карточка «Кубики»: поле выражения, быстрые кнопки системы, результат из flash и последние броски.
     Модель: quickDice, difficultyPresets, recentRolls; flash: rollResult, checkResult, rollLabel, rollError. showAuthor — показывать, кто бросал. -->
<body>

<!-- Итог проверки с шагами расчёта. Flash: checkResult, rollLabel -->
<div th:fragment="check-result" th:if="${checkResult != null}" class="dice-result" role="status"
     th:classappend="${checkResult.success == null} ? '' : (${checkResult.success} ? 'is-success' : 'is-fail')">
  <div class="dice-total" th:text="${checkResult.total}">17</div>
  <div class="dice-detail">
    <div class="row-title">
      <span th:text="${rollLabel != null ? rollLabel : 'Проверка'}">Проверка</span>
      <span th:text="'· ' + ${checkResult.outcome()}">· 17 vs 15 — успех</span>
    </div>
    <ol class="alert-steps">
      <li th:each="step : ${checkResult.steps}" th:text="${step}">Бросок d10: 7</li>
    </ol>
  </div>
</div>

<section th:fragment="card(base, showAuthor)" class="card" id="dice">
  <div class="card-head">
    <h2 class="card-title"><span class="dot"></span>Кубики</h2>
  </div>

  <div class="card-body">
    <div th:if="${rollResult != null}" class="dice-result" role="status">
      <div class="dice-total" th:text="${rollResult.total}">11</div>
      <div class="dice-detail">
        <div class="row-title">
          <span th:if="${rollLabel != null}" th:text="${rollLabel} + ' · '">Атака · </span>
          <span th:text="${rollResult.expression}">2d6+3</span>
        </div>
        <div class="row-meta" th:text="${rollResult.details()}">[3, 5] + 3 = 11</div>
      </div>
    </div>
    <div th:replace="~{:: check-result}"></div>
    <div th:if="${rollError != null}" class="alert alert-error" role="alert">
      <span class="alert-text" th:text="${rollError}">Ошибка</span>
      <button type="button" class="alert-close" aria-label="Закрыть">×</button>
    </div>

    <form th:action="@{${base} + '/roll'}" method="post" class="form">
      <div class="form-row">
        <input type="text" name="expression" class="grow" placeholder="2d6+3" required autocomplete="off"
               aria-label="Выражение броска" maxlength="64">
        <input type="text" name="label" class="narrow" placeholder="Подпись" autocomplete="off"
               aria-label="Подпись броска" maxlength="255">
        <button type="submit" class="btn btn-primary">🎲 Бросить</button>
      </div>
      <!-- A-09: у мастера кампании — бросок, которого игроки не видят; выбор запоминается -->
      <label th:if="${showAuthor}" class="check dice-hidden" title="Игроки этот бросок не увидят; в ленте его можно показать всем">
        <input type="checkbox" name="hidden" value="true" data-remember="dice-hidden"><span>🙈 Скрыто</span>
      </label>
      <div class="dice-quick">
        <button th:each="d : ${quickDice}" type="submit" name="quick" th:value="${d}" formnovalidate
                class="btn btn-sm" th:text="${d}">d10</button>
      </div>
    </form>

    <form th:action="@{${base} + '/check'}" method="post" class="form dice-check">
      <div class="form-row">
        <input type="number" name="modifier" class="narrow" placeholder="±Мод." step="1"
               aria-label="Модификатор проверки" title="Стат + навык + прочие модификаторы">
        <input type="number" name="difficulty" class="narrow" placeholder="DC" step="1" min="0"
               list="difficulty-presets" aria-label="Сложность (необязательно)" title="Сложность (необязательно)">
        <input type="text" name="label" class="grow" placeholder="Что проверяем" autocomplete="off"
               aria-label="Подпись проверки" maxlength="255">
        <button type="submit" class="btn">✓ Проверить</button>
      </div>
      <label th:if="${showAuthor}" class="check dice-hidden" title="Игроки эту проверку не увидят">
        <input type="checkbox" name="hidden" value="true" data-remember="dice-hidden"><span>🙈 Скрыто</span>
      </label>
      <datalist id="difficulty-presets">
        <option th:each="d : ${difficultyPresets}" th:value="${d.value}" th:label="${d.key}">15</option>
      </datalist>
    </form>
  </div>

  <!-- Лог: строка на бросок; расчёт обрезан, целиком — во всплывающей подсказке -->
  <div class="card-body roll-log" th:unless="${#lists.isEmpty(recentRolls)}">
    <div th:each="r : ${recentRolls}" class="roll-row"
         th:title="${r.expression} + ': ' + ${r.details} + (${r.gameDate != null} ? ' · ' + ${r.gameDate} : '')">
      <span class="roll-who"><th:block th:if="${showAuthor}" th:text="${r.character != null ? r.character.name : 'Мастер'}">Колясик</th:block><th:block
            th:if="${showAuthor and r.label != null}"> · </th:block><th:block
            th:if="${r.label != null}" th:text="${r.label}">Атака</th:block><th:block
            th:if="${!showAuthor and r.label == null}">Бросок</th:block></span>
      <span class="roll-details" th:text="${r.expression} + ': ' + ${r.details}">2d6: [3, 5] = 8</span>
      <span class="roll-total" th:text="${r.total}">8</span>
    </div>
  </div>
  <!-- Листалка лога: только там, где контроллер дал страницу (кампания) -->
  <nav th:if="${rollPage != null and rollPage.totalPages > 1}" class="card-body pager" aria-label="Страницы лога бросков">
    <a th:if="${rollPage.hasPrevious()}" class="btn btn-sm btn-ghost"
       th:href="@{${base}(rolls=${rollPage.number - 1})} + '#dice'">← Новее</a>
    <span class="pager-info" th:text="${rollPage.number + 1} + ' из ' + ${rollPage.totalPages}">1 из 3</span>
    <a th:if="${rollPage.hasNext()}" class="btn btn-sm btn-ghost"
       th:href="@{${base}(rolls=${rollPage.number + 1})} + '#dice'">Старее →</a>
  </nav>
</section>

<!-- R-04: журнал бросков кампании с листалкой — отдельно от «Стола» (там последние 30 вперемешку с чатом) -->
<details th:fragment="roll-log(base)" class="card roll-log-card" id="roll-log" th:open="${param.rolls != null}">
  <summary class="card-head"><h2 class="card-title"><span class="dot"></span>Журнал бросков</h2>
    <span class="badge" th:if="${rollPage != null}" th:text="${rollPage.totalElements}">25</span></summary>
  <div class="card-body roll-log" th:unless="${#lists.isEmpty(recentRolls)}">
    <div th:each="r : ${recentRolls}" class="roll-row"
         th:title="${r.expression} + ': ' + ${r.details} + (${r.gameDate != null} ? ' · ' + ${r.gameDate} : '')">
      <span class="roll-who"><th:block th:text="${r.character != null ? r.character.name : 'Мастер'}">Колясик</th:block><th:block
            th:if="${r.label != null}" th:text="' · ' + ${r.label}"> · Атака</th:block><th:block th:if="${r.hidden}"> 🙈</th:block></span>
      <span class="roll-details" th:text="${r.expression} + ': ' + ${r.details}">2d6: [3, 5] = 8</span>
      <span class="roll-total" th:text="${r.total}">8</span>
    </div>
  </div>
  <div class="card-body empty" th:if="${#lists.isEmpty(recentRolls)}">Бросков ещё не было</div>
  <nav th:if="${rollPage != null and rollPage.totalPages > 1}" class="card-body pager" aria-label="Страницы лога бросков">
    <a th:if="${rollPage.hasPrevious()}" class="btn btn-sm btn-ghost"
       th:href="@{${base}(rolls=${rollPage.number - 1})} + '#roll-log'">← Новее</a>
    <span class="pager-info" th:text="${rollPage.number + 1} + ' из ' + ${rollPage.totalPages}">1 из 3</span>
    <a th:if="${rollPage.hasNext()}" class="btn btn-sm btn-ghost"
       th:href="@{${base}(rolls=${rollPage.number + 1})} + '#roll-log'">Старее →</a>
  </nav>
</details>
</body>
</html>
