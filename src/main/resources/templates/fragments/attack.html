<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Диалог атаки оружием; что спрашивать, задаёт AttackForm системы. Модификаторы открыты сразу: в атаке они главное содержимое. -->
<dialog th:fragment="dialog(characterId, item, form, targets)" class="dialog attack-dialog" th:id="'attack-' + ${item.id}" data-attack>
  <form th:action="@{'/character/' + ${characterId} + '/items/' + ${item.id} + '/attack'}" method="post" class="form">
    <div>
      <h2 class="card-title" th:text="'Атака: ' + ${item.name}">Атака: Minami</h2>
      <p class="page-sub">
        <span th:if="${form.damage != null}" th:text="'Урон ' + ${form.damage}">Урон 2D6+3</span>
        <span th:if="${form.range != null}" th:text="' · дальность ' + ${form.range} + ' м'"> · дальность 200 м</span>
      </p>
    </div>

    <div class="field-grid">
      <label class="field" th:hidden="${#lists.size(form.modes) < 2}">
        <span class="label">Режим</span>
        <select name="mode" data-attack-mode>
          <option th:each="m : ${form.modes}" th:value="${m.code}" th:text="${m.label}"
                  th:attr="data-rounds=${m.rounds},data-zone=${m.zone},data-area=${m.area},data-planted=${m.planted}">Одиночный</option>
        </select>
      </label>
      <label class="field" data-attack-rounds hidden>
        <span class="label" th:text="${form.roundsLabel}">Патронов</span>
        <input type="number" name="rounds" min="1" th:attr="max=${form.maxRounds}" th:value="${form.defaultRounds}">
      </label>
      <label class="field" data-attack-width hidden>
        <span class="label">Ширина зоны, м</span>
        <input type="number" name="zoneWidth" min="2" value="2">
      </label>
      <label class="field">
        <span class="label" data-attack-target-label>Цель</span>
        <select name="target" data-attack-target>
          <th:block th:replace="~{fragments/attack :: target-options(${targets})}"></th:block>
          <option value="">Без листа</option>
        </select>
      </label>
      <label class="field">
        <span class="label">Имя цели без листа</span>
        <input type="text" name="targetName" maxlength="100" autocomplete="off">
      </label>
      <label class="field" data-attack-distance>
        <span class="label">Расстояние, м</span>
        <input type="number" name="distance" min="0" required>
      </label>
      <label class="field" data-attack-location-field>
        <span class="label">Зона (выбор −4)</span>
        <select name="location" data-attack-location>
          <option value="">Случайная</option>
          <option th:each="l : ${form.locations}" th:value="${l.value}" th:text="${l.label}">Торс</option>
        </select>
      </label>
      <label class="field" th:if="${#lists.size(form.skills) > 1}">
        <span class="label">Навык</span>
        <select name="skill">
          <option th:each="s : ${form.skills}" th:value="${s.value}" th:text="${s.label}">Пистолеты</option>
        </select>
      </label>
    </div>

    <fieldset th:each="section : ${form.sections}" class="attack-section" data-attack-roll>
      <legend th:text="${section.name}">Цель</legend>
      <div class="attack-options">
        <th:block th:each="choice : ${section.choices}">
          <label th:if="${choice.flag}" class="check">
            <input type="checkbox" th:name="'option.' + ${choice.key}" th:value="${choice.options[0].value}">
            <span th:text="${choice.options[0].label}">Цель неподвижна +4</span>
          </label>
          <label th:unless="${choice.flag}" class="field">
            <span class="label" th:text="${choice.label}">Цель движется</span>
            <select th:name="'option.' + ${choice.key}">
              <option value="">—</option>
              <option th:each="o : ${choice.options}" th:value="${o.value}" th:text="${o.label}">REF больше 10 −3</option>
            </select>
          </label>
        </th:block>
      </div>
    </fieldset>

    <label class="field" data-attack-roll>
      <span class="label">Прочий модификатор</span>
      <input type="number" name="modifier" value="0">
    </label>

    <div class="form-row dialog-actions">
      <button type="button" class="btn btn-ghost" data-dialog-close>Закрыть</button>
      <button type="submit" class="btn btn-primary">🎲 Атаковать</button>
    </div>
  </form>
</dialog>

<!-- Персонажи кампании для выбора: игроки отдельно от NPC -->
<th:block th:fragment="target-options(targets)">
  <optgroup label="Игроки" th:unless="${#lists.isEmpty(targets.?[!npc])}">
    <option th:each="t : ${targets.?[!npc]}" th:value="${t.id}" th:text="${t.name}">Олежа</option>
  </optgroup>
  <optgroup label="NPC" th:unless="${#lists.isEmpty(targets.?[npc])}">
    <option th:each="t : ${targets.?[npc]}" th:value="${t.id}" th:text="${t.name}">Бустер 1</option>
  </optgroup>
</th:block>

<!-- Итог атаки. Если заряд упал мимо, мастер выбирает здесь, кого задело: позиций на листе нет. -->
<div th:fragment="result(characterId, result, targets)" class="alert item-result" role="status"
     th:classappend="${result.hit} ? 'alert-success' : 'alert-error'">
  <div class="alert-text">
    <strong th:text="${result.title} + ': ' + ${result.outcome}">Minami → Олежа: попадание</strong>
    <ol class="attack-steps"><li th:each="step : ${result.steps}" th:text="${step}">Бросок d10: 7</li></ol>
    <form th:if="${result.scattered != null and !#lists.isEmpty(targets)}" class="form-row" method="post"
          th:action="@{'/character/' + ${characterId} + '/attack/blast'}">
      <input type="hidden" name="weapon" th:value="${result.scattered.weapon}">
      <input type="hidden" name="expression" th:value="${result.scattered.expression}">
      <input type="hidden" name="amount" th:value="${result.scattered.amount}">
      <input type="hidden" name="damageType" th:value="${result.scattered.damageType}">
      <input type="hidden" name="wholeBody" th:value="${result.scattered.wholeBody}">
      <input type="hidden" name="armorWear" th:value="${result.scattered.armorWear}">
      <input type="hidden" name="radius" th:value="${result.scattered.radius}">
      <label class="field grow">
        <span class="label" th:text="'Кого задело (урон ' + ${result.scattered.amount} + ', зона ' + ${result.scattered.radius} + ' м)'">Кого задело</span>
        <select name="target" multiple required>
          <th:block th:replace="~{fragments/attack :: target-options(${targets})}"></th:block>
        </select>
      </label>
      <button type="submit" class="btn btn-sm btn-primary">Применить урон</button>
    </form>
  </div>
  <button type="button" class="alert-close" aria-label="Закрыть">×</button>
</div>
</body>
</html>
