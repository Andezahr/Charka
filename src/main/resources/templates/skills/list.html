<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Навыки ' + ${character.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar(${character.id}, 'skills')}"></header>

<!-- По умолчанию видны только изученные навыки; остальное включает app.js (см. блок «Страница навыков») -->
<main class="page" data-skills th:with="base=@{'/character/' + ${character.id}}">
  <div class="page-head skills-head">
    <div data-editable>
      <span class="eyebrow">Навыки</span>
      <h1 class="page-title" th:text="${character.name}">Имя персонажа</h1>
      <p class="page-sub skills-role">
        <span th:text="${sheet.role != null} ? ${sheet.role.name} : 'Роль не выбрана'">Соло</span>
        <button type="button" class="icon-btn" title="Изменить роль" aria-label="Изменить роль" data-edit-toggle>✎</button>
      </p>
      <div class="edit-panel">
        <form th:action="${base} + '/role'" method="post" class="form-row">
          <select name="role" aria-label="Роль">
            <option value="">— не выбрана —</option>
            <option th:each="r : ${sheet.roles}" th:value="${r.code}" th:text="${r.name}"
                    th:selected="${sheet.role != null and sheet.role.code == r.code}">Соло</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary">Сохранить</button>
        </form>
      </div>
    </div>
  </div>

  <div th:if="${successMessage != null}" class="alert alert-success" role="status">
    <span class="alert-text" th:text="${successMessage}">Сохранено</span>
    <button type="button" class="alert-close" aria-label="Закрыть">×</button>
  </div>
  <div th:if="${errorMessage != null}" class="alert alert-error" role="alert">
    <span class="alert-text" th:text="${errorMessage}">Ошибка</span>
    <button type="button" class="alert-close" aria-label="Закрыть">×</button>
  </div>
  <form th:if="${sheet.statsMissing}" th:action="${base} + '/skills/setup'" method="post" class="skills-notice">
    <span>У персонажа нет характеристик, поэтому итоги считаются только по уровню навыка.</span>
    <button type="submit" class="btn btn-sm">Создать счётчики системы</button>
  </form>

  <!-- Текущие статы; нажатие — переход к группе навыков -->
  <nav class="skills-stats" th:unless="${sheet.statsMissing}" aria-label="Статы">
    <th:block th:each="group : ${sheet.groups}">
      <a th:if="${group.stat != null}" class="chip" th:href="'#group-' + ${group.stat.code}" data-skills-jump
         th:classappend="${group.stat.reduced} ? 'red' : 'muted'"
         th:title="${group.stat.reduced} ? 'Штраф: без него ' + ${group.stat.base}"
         th:text="${group.stat.name} + ' ' + ${group.stat.value} + (${group.stat.reduced} ? '/' + ${group.stat.base} : '')">REF 4/6</a>
    </th:block>
  </nav>

  <div class="skills-toolbar">
    <input type="search" class="skills-search" placeholder="Найти навык" aria-label="Найти навык"
           autocomplete="off" data-skills-search>
    <button type="button" class="btn" data-skills-all aria-pressed="false">Все навыки</button>
    <button type="button" class="btn" data-skills-edit>Изменить уровни</button>
  </div>

  <p class="empty" data-skills-empty hidden></p>

  <form id="skill-levels" th:action="${base} + '/skills'" method="post"></form>

  <div class="skills-grid">
    <section th:each="group : ${sheet.groups}" class="card" data-skills-group
             th:id="${group.stat != null} ? 'group-' + ${group.stat.code}">
      <div class="card-head">
        <h2 class="card-title">
          <span class="dot" th:classappend="${group.special} ? 'pink'"></span>
          <span th:text="${group.title}">REF</span>
        </h2>
      </div>
      <div class="skills-rows">
        <div th:each="row : ${group.rows}" class="skill-row" data-skill-row
             th:classappend="${row.level == 0} ? 'is-zero'"
             th:attr="data-always=${group.special}">
          <div class="skill-name">
            <span data-skill-name th:text="${row.name}">Пистолеты</span>
            <span th:if="${group.special}" class="skill-note" th:text="${row.statName}">INT</span>
            <span th:if="${row.level > 0}" class="skill-note skill-level" title="Уровень навыка"
                  th:text="'ур. ' + ${row.level}">ур. 4</span>
          </div>
          <input type="number" class="skill-input" form="skill-levels" min="0" max="10"
                 th:name="${row.customId != null} ? 'custom.' + ${row.customId} : 'level.' + ${row.code}"
                 th:value="${row.level}" th:aria-label="${row.name}">
          <form th:if="${row.customId != null}" th:action="${base} + '/skills/custom/' + ${row.customId} + '/delete'"
                method="post" class="inline skill-delete" data-confirm="Удалить навык?">
            <button type="submit" class="icon-btn danger" title="Удалить навык" aria-label="Удалить навык">×</button>
          </form>
          <button type="button" class="btn btn-sm skill-check" data-skill-check
                  th:data-code="${row.code}" th:data-skill-id="${row.customId}" th:data-name="${row.name}"
                  th:data-sum="${row.statName} + ' ' + ${row.statValue} + ' + навык ' + ${row.level} + ' = ' + ${row.total}"
                  th:aria-label="'Проверить: ' + ${row.name} + ', итог ' + ${row.total}"
                  th:text="'🎲 ' + ${row.total}">🎲 12</button>
        </div>
      </div>
      <div th:unless="${#lists.isEmpty(group.customTypes)}" class="skill-add">
        <div th:each="t : ${group.customTypes}" class="skill-add-item" data-editable>
          <button type="button" class="btn btn-sm btn-ghost" data-edit-toggle th:text="'＋ ' + ${t.name}">＋ Язык</button>
          <div class="edit-panel">
            <form th:action="${base} + '/skills/custom'" method="post" class="form-row">
              <input type="hidden" name="code" th:value="${t.code}">
              <input type="text" name="customName" class="grow" placeholder="Название" required maxlength="100"
                     autocomplete="off" th:aria-label="'Название: ' + ${t.name}">
              <input type="number" name="level" class="narrow" min="0" max="10" value="1" required aria-label="Уровень">
              <button type="submit" class="btn btn-sm btn-primary">Добавить</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="skills-savebar">
    <button type="submit" form="skill-levels" class="btn btn-primary">Сохранить уровни</button>
    <button type="button" class="btn btn-ghost" data-skills-edit>Отмена</button>
  </div>

  <dialog class="dialog" id="skill-check-dialog" aria-labelledby="skill-check-title">
    <form th:action="@{'/api/characters/' + ${character.id} + '/skills/check'}" method="post" class="form">
      <input type="hidden" name="code">
      <input type="hidden" name="skillId">
      <div>
        <h2 class="card-title" id="skill-check-title" data-check-title>Навык</h2>
        <p class="page-sub" data-check-sum>REF 8 + навык 4 = 12</p>
      </div>
      <div class="dice-result" data-check-result role="status" hidden>
        <div class="dice-total" data-check-total>17</div>
        <div class="dice-detail">
          <div class="row-title" data-check-outcome>17 vs 15 — успех</div>
          <ol class="alert-steps" data-check-steps></ol>
        </div>
      </div>
      <p class="alert alert-error" data-check-error role="alert" hidden></p>
      <label class="field">
        <span class="label">Сложность</span>
        <input type="number" name="difficulty" min="0" step="1" placeholder="Без сложности" autocomplete="off">
      </label>
      <div class="dice-quick">
        <button th:each="d : ${difficultyPresets}" type="button" class="btn btn-sm" th:data-dc="${d.value}"
                th:text="${d.key} + ' ' + ${d.value}">Средне 15</button>
      </div>
      <details class="dialog-more">
        <summary class="label">Доп. модификатор</summary>
        <input type="number" name="modifier" step="1" value="0" aria-label="Дополнительный модификатор">
      </details>
      <div class="form-row dialog-actions">
        <button type="button" class="btn btn-ghost" data-dialog-close>Закрыть</button>
        <button type="submit" class="btn btn-primary" autofocus data-check-submit>🎲 Бросить</button>
      </div>
    </form>
  </dialog>
</main>
</body>
</html>
