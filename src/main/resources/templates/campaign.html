<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Кампания: ' + ${campaign.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar(null, 'campaign')}"></header>

<main class="page">
  <div class="page-head">
    <div>
      <span class="eyebrow">Кампания · <span th:text="${gameSystem.displayName}">Система</span></span>
      <h1 class="page-title" th:text="${campaign.name}">Название кампании</h1>
      <p class="page-sub" th:if="${campaign.startDate != null}">
        Началась <span th:text="${campaign.startDate}">дата</span>
      </p>
    </div>
    <div class="page-actions">
      <a th:href="@{/}" class="btn btn-ghost">← На главную</a>
      <a th:href="@{'/api/campaigns/' + ${campaign.id} + '/download'}" class="btn" download>⬇ Скачать JSON</a>
    </div>
  </div>

  <div class="grid grid-main">
    <!-- Персонажи и их раны -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="dot"></span>Персонажи кампании</h2>
        <span class="badge" th:text="${#lists.size(campaign.characters)}">0</span>
      </div>
      <div class="card-body">
        <form th:action="@{'/campaign/' + ${campaign.id} + '/characters'}" method="post" class="form-row">
          <input type="text" name="name" class="grow" placeholder="Имя нового персонажа" required autocomplete="off">
          <button type="submit" class="btn btn-primary">＋ Добавить</button>
        </form>
      </div>
      <div class="card-body list">
        <div th:each="character : ${campaign.characters}" class="char-card">
          <div class="char-card-head">
            <a th:href="@{'/character/' + ${character.id}}" class="with-avatar">
              <span class="avatar" th:text="${#strings.substring(character.name, 0, 1)}">П</span>
              <span class="char-card-name" th:text="${character.name}">Имя персонажа</span>
            </a>
            <a th:href="@{'/character/' + ${character.id}}" class="btn btn-sm btn-ghost">Открыть →</a>
          </div>
          <div class="chips">
            <span th:each="wound : ${character.wounds}" class="chip red">
              🩸 <span th:text="${wound.name}">Рана</span>
              <span th:if="${wound.severity != null}" th:text="'· ' + ${wound.severity}">· 1</span>
            </span>
            <span th:if="${#lists.isEmpty(character.wounds)}" class="chip muted">Без ран</span>
          </div>
        </div>
        <div th:if="${#lists.isEmpty(campaign.characters)}" class="empty">В кампании пока нет персонажей</div>
      </div>
    </section>

    <!-- Время и хроника -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="dot pink"></span>Хроника</h2>
        <span class="badge" th:text="${#lists.size(campaign.chronicles)}">0</span>
      </div>
      <div class="card-body">
        <div class="date-hero">
          <span class="label">Текущая дата</span>
          <div class="date" th:text="${currentDate}">2037-01-01</div>
        </div>
      </div>
      <div class="card-body">
        <form th:action="@{'/campaign/' + ${campaign.id} + '/chronicles'}" method="post" class="form">
          <div class="field">
            <label for="chronicle-name">Время летит…</label>
            <input id="chronicle-name" type="text" name="name" placeholder="Что произошло за это время" required autocomplete="off">
          </div>
          <div class="form-row">
            <input type="number" name="duration" placeholder="Дней" required min="1" aria-label="Длительность (дней)">
            <button type="submit" class="btn btn-pink">⏩ Промотать</button>
          </div>
        </form>
      </div>
      <div class="card-body">
        <div class="timeline" th:unless="${#lists.isEmpty(campaign.chronicles)}">
          <div th:each="chronicle : ${campaign.chronicles}" class="timeline-item">
            <div class="timeline-title" th:text="${chronicle.name}">Название</div>
            <div class="timeline-dates">
              <span th:text="${chronicle.startDate}">начало</span> — <span th:text="${chronicle.endDate}">конец</span>
            </div>
          </div>
        </div>
        <div th:if="${#lists.isEmpty(campaign.chronicles)}" class="empty">Хроника пуста</div>
      </div>
    </section>
  </div>
</main>
</body>
</html>
