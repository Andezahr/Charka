<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Счётчики')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar(${characterId}, 'counters')}"></header>

<main class="page">
  <div class="page-head">
    <div>
      <span class="eyebrow">Счётчики</span>
      <h1 class="page-title"
          th:text="${counters != null and !counters.empty and counters[0].characterName != null} ? ${counters[0].characterName} : 'Счётчики персонажа'">
        Счётчики персонажа
      </h1>
      <p class="page-sub">ХП, опыт, патроны — всё, что нужно считать.
        <span th:if="${#lists.contains(counterTypes.![type], 'CP2020_HEALTH')}">Для боя по CP2020 — счётчик «Здоровье».</span></p>
    </div>
    <div class="page-actions">
      <a th:href="@{/character/{characterId}(characterId=${characterId})}" class="btn btn-ghost">← К персонажу</a>
    </div>
  </div>

  <!-- Сообщения об успехе/ошибке -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span>✓</span>
    <div class="alert-text">
      <div th:text="${successMessage}"></div>
      <ol th:if="${healthSteps != null and !healthSteps.empty}" class="alert-steps">
        <li th:each="step : ${healthSteps}" th:text="${step}"></li>
      </ol>
    </div>
    <button type="button" class="alert-close" aria-label="Закрыть">×</button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-error" role="alert">
    <span>⚠</span>
    <span class="alert-text" th:text="${errorMessage}"></span>
    <button type="button" class="alert-close" aria-label="Закрыть">×</button>
  </div>

  <div class="grid grid-sidebar">
    <!-- Форма создания нового счётчика -->
    <aside class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="dot green"></span>Новый счётчик</h2>
      </div>
      <div class="card-body">
        <form th:action="@{/character/{characterId}/counters/create(characterId=${characterId})}"
              method="post" th:object="${createRequest}" class="form">
          <input type="hidden" th:field="*{characterId}">
          <div class="field">
            <label for="name">Название</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Например, ХП" required autocomplete="off">
          </div>
          <div class="field">
            <label for="counterType">Тип</label>
            <select id="counterType" th:field="*{counterType}" required data-type-select>
              <option th:each="t : ${counterTypes}" th:value="${t.type}" th:text="${t.displayName}"
                      th:attr="data-initial=${t.usesInitialValue}">Простой числовой</option>
            </select>
          </div>
          <!-- Доп. поля типа: показываются только для выбранного типа (см. data-type-fields в app.js) -->
          <th:block th:each="t : ${counterTypes}" th:if="${t.createFieldsTemplate != null}">
            <div class="form" th:attr="data-type-fields=${t.type}" hidden>
              <th:block th:replace="~{__${t.createFieldsTemplate}__ :: create-fields}"></th:block>
            </div>
          </th:block>
          <div class="field" data-initial-field>
            <label for="initialValue">Начальное значение</label>
            <input type="number" id="initialValue" name="initialValue"
                   th:value="${createRequest.initialValue != null} ? ${createRequest.initialValue} : 0" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">＋ Создать</button>
        </form>
      </div>
    </aside>

    <!-- Список счётчиков -->
    <div>
      <div class="counter-grid" th:if="${counters != null and !counters.empty}">
        <!-- Каждый тип счётчика рисует себя сам: стратегия называет шаблон с фрагментом card -->
        <th:block th:each="counter : ${counters}">
          <div th:replace="~{__${counter.viewTemplate}__ :: card}"></div>
        </th:block>
      </div>

      <div th:if="${counters == null or counters.empty}" class="card">
        <div class="card-body">
          <div class="empty">
            Счётчиков пока нет — создайте первый с помощью формы слева
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
