<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Счётчики')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar(${characterId}, 'counters')}"></header>

<main class="page">
  <div class="page-head">
    <div>
      <span class="eyebrow">Счётчики</span>
      <h1 class="page-title"
          th:text="${counters != null and !counters.empty and counters[0].characterName != null} ? ${counters[0].characterName} : 'Счётчики персонажа'">
        Счётчики персонажа
      </h1>
      <p class="page-sub">ХП, опыт, патроны — всё, что нужно считать.</p>
    </div>
    <div class="page-actions">
      <a th:href="@{/character/{characterId}(characterId=${characterId})}" class="btn btn-ghost">← К персонажу</a>
    </div>
  </div>

  <!-- Сообщения об успехе/ошибке -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span>✓</span>
    <span class="alert-text" th:text="${successMessage}"></span>
    <button type="button" class="alert-close" aria-label="Закрыть">×</button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-error" role="alert">
    <span>⚠</span>
    <span class="alert-text" th:text="${errorMessage}"></span>
    <button type="button" class="alert-close" aria-label="Закрыть">×</button>
  </div>

  <div class="grid grid-sidebar">
    <!-- Форма создания нового счётчика -->
    <aside class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="dot green"></span>Новый счётчик</h2>
      </div>
      <div class="card-body">
        <form th:action="@{/character/{characterId}/counters/create(characterId=${characterId})}"
              method="post" th:object="${createRequest}" class="form">
          <input type="hidden" th:field="*{characterId}">
          <div class="field">
            <label for="name">Название</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Например, ХП" required autocomplete="off">
          </div>
          <div class="field">
            <label for="counterType">Тип</label>
            <select id="counterType" th:field="*{counterType}" required>
              <option value="SIMPLE_INTEGER">Простой числовой</option>
            </select>
          </div>
          <div class="field">
            <label for="initialValue">Начальное значение</label>
            <input type="number" id="initialValue" name="initialValue"
                   th:value="${createRequest.initialValue != null} ? ${createRequest.initialValue} : 0" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">＋ Создать</button>
        </form>
      </div>
    </aside>

    <!-- Список счётчиков -->
    <div>
      <div class="counter-grid" th:if="${counters != null and !counters.empty}">
        <div th:each="counter : ${counters}" class="counter">
          <div class="counter-head">
            <div>
              <div class="counter-name" th:text="${counter.name}">Счётчик</div>
              <div class="counter-meta">
                <span th:text="'#' + ${counter.id}">#1</span>
                <span th:if="${counter.counterType != null}" th:text="'· ' + ${counter.counterType}">· SIMPLE_INTEGER</span>
              </div>
            </div>
            <form th:action="@{/character/{characterId}/counters/{counterId}(characterId=${characterId}, counterId=${counter.id})}"
                  th:method="delete" class="inline" data-confirm="Удалить счётчик?">
              <button type="submit" class="icon-btn danger" title="Удалить счётчик">✕</button>
            </form>
          </div>

          <div class="counter-value" th:text="${counter.value}">0</div>

          <div class="counter-quick">
            <form th:action="@{/character/{characterId}/counters/{counterId}/update(characterId=${characterId}, counterId=${counter.id})}" method="post">
              <input type="hidden" name="value" value="-1">
              <button type="submit" class="btn btn-danger" aria-label="Уменьшить на 1">−1</button>
            </form>
            <form th:action="@{/character/{characterId}/counters/{counterId}/reset(characterId=${characterId}, counterId=${counter.id})}"
                  method="post" data-confirm="Сбросить счётчик?">
              <button type="submit" class="btn btn-warning" aria-label="Сбросить">↺</button>
            </form>
            <form th:action="@{/character/{characterId}/counters/{counterId}/update(characterId=${characterId}, counterId=${counter.id})}" method="post">
              <input type="hidden" name="value" value="1">
              <button type="submit" class="btn btn-success" aria-label="Увеличить на 1">+1</button>
            </form>
          </div>

          <form th:action="@{/character/{characterId}/counters/{counterId}/update(characterId=${characterId}, counterId=${counter.id})}"
                method="post" class="form-row">
            <input type="number" name="value" placeholder="± изменить на" required aria-label="Изменить счётчик на">
            <button type="submit" class="btn btn-sm">Применить</button>
          </form>
          <form th:action="@{/character/{characterId}/counters/{counterId}/set(characterId=${characterId}, counterId=${counter.id})}"
                method="post" class="form-row">
            <input type="number" name="setValue" placeholder="= установить" required aria-label="Новое значение">
            <button type="submit" class="btn btn-sm">Установить</button>
          </form>
        </div>
      </div>

      <div th:if="${counters == null or counters.empty}" class="card">
        <div class="card-body">
          <div class="empty">
            Счётчиков пока нет — создайте первый с помощью формы слева
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
