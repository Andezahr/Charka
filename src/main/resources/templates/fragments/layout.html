<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!-- Общие куски разметки для всех страниц: <head>, верхняя панель, вкладки персонажа -->

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' · Charka'">Charka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Russo+One&display=swap">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<!-- Верхняя панель. characterId != null → показываются вкладки персонажа, active — текущая вкладка -->
<th:block th:fragment="topbar(characterId, active)">
<header class="topbar">
  <div class="topbar-inner">
    <a th:href="@{/}" class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Charka</span>
    </a>
    <nav class="topnav" th:if="${characterId != null}">
      <a th:href="@{'/character/' + ${characterId}}"
         th:classappend="${active == 'sheet'} ? 'is-active'">Лист</a>
      <a th:if="${@skillService.hasCatalog(characterId)}" th:href="@{'/character/' + ${characterId} + '/skills'}"
         th:classappend="${active == 'skills'} ? 'is-active'">Навыки</a>
      <a th:href="@{'/character/' + ${characterId} + '/counters'}"
         th:classappend="${active == 'counters'} ? 'is-active'">Счётчики</a>
      <a th:href="@{'/character/' + ${characterId} + '/notes'}"
         th:classappend="${active == 'notes'} ? 'is-active'">Заметки</a>
      <!-- Бой идёт: с листа в трекер одним нажатием -->
      <th:block th:with="fight=${@encounterService.campaignInFight(characterId)}">
        <a th:if="${fight != null}" th:href="@{'/campaign/' + ${fight} + '/encounter'}">⚔ Бой</a>
      </th:block>
    </nav>
    <nav class="topnav" th:unless="${characterId != null}">
      <a th:href="@{/}" th:classappend="${active == 'home'} ? 'is-active'">Главная</a>
    </nav>
    <!-- U-03: кто вошёл и выход -->
    <th:block th:with="me=${@accessService.current().orElse(null)}">
      <form th:if="${me != null}" th:action="@{/logout}" method="post" class="topbar-user">
        <span th:text="${me.username}">kolya</span>
        <button type="submit" class="btn btn-sm btn-ghost">Выйти</button>
      </form>
    </th:block>
  </div>
</header>
  <!-- A-01: отменить только что сделанное. Вне header: его backdrop-filter держит position: fixed внутри себя. undoOffer кладёт UndoInterceptor после любого действия игры -->
  <div th:if="${undoOffer != null or undoDone != null or undoError != null or requestResults != null or requestError != null}" class="undo-toast" role="status">
    <form th:if="${undoOffer != null}" method="post" class="undo-form"
          th:action="@{'/campaign/' + ${undoOffer.campaignId()} + '/undo/' + ${undoOffer.id()}}">
      <span class="undo-label" th:text="${undoOffer.label()}">Колясик: выстрел — Militech Avenger</span>
      <button type="submit" class="btn btn-sm">↶ Отменить</button>
    </form>
    <span th:if="${undoDone != null}" class="undo-label is-done" th:text="${undoDone}">Отменено: …</span>
    <span th:if="${undoError != null}" class="undo-label is-error" th:text="${undoError}">Отменить нельзя</span>
    <!-- A-07: итог броска по запросу мастера -->
    <span th:each="line : ${requestResults}" class="undo-label is-done" th:text="'🎲 ' + ${line}">Колясик: Внимательность 15: 17 — успех</span>
    <span th:if="${requestError != null}" class="undo-label is-error" th:text="${requestError}">Уже брошено</span>
    <button type="button" class="undo-close" data-undo-close aria-label="Закрыть">×</button>
  </div>
</th:block>

</body>
</html>
