<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Главная')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(null, null, 'home')}"></header>

<main class="page">
  <div th:if="${errorMessage != null}" class="alert alert-error" role="alert">
    <span class="alert-text" th:text="${errorMessage}">Ошибка</span>
    <button type="button" class="alert-close" aria-label="Закрыть">×</button>
  </div>
  <div class="grid grid-2">
    <!-- R-19: вошедшему — сразу списки; создание и импорт кампании — в диалоге -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="dot"></span>Мои кампании</h2>
        <span class="badge" th:text="${#lists.size(campaigns)}">0</span>
        <button type="button" class="btn btn-sm btn-primary add-btn" data-dialog-open="campaign-dialog">＋ Кампания</button>
        <dialog class="dialog" id="campaign-dialog">
          <h2 class="card-title">Новая кампания</h2>
          <form th:action="@{/campaigns}" method="post" class="form">
            <input type="text" name="name" placeholder="Название" required autocomplete="off" aria-label="Название" autofocus>
            <div class="form-row">
              <select name="system" aria-label="Игровая система" required class="grow">
                <option th:each="s : ${systems}" th:value="${s.code}" th:text="${s.displayName}"
                        th:selected="${s.code == 'CP2020'}">Система</option>
              </select>
              <input type="date" name="startDate" aria-label="Дата начала (по умолчанию — сегодня)"
                     title="Дата начала (по умолчанию — сегодня)">
            </div>
            <div class="form-row dialog-actions">
              <button type="button" class="btn btn-ghost" data-dialog-close>Отмена</button>
              <button type="submit" class="btn btn-primary">＋ Кампания</button>
            </div>
          </form>
          <form th:action="@{/campaigns/import}" method="post" enctype="multipart/form-data" class="form dialog-import">
            <span class="muted">или из файла экспорта</span>
            <div class="form-row">
              <label class="btn btn-sm file-pick grow" data-file-pick>
                <input type="file" name="file" accept=".json,application/json" required aria-label="JSON экспорта кампании">
                <span data-file-name>📄 Выбрать JSON…</span>
              </label>
              <button type="submit" class="btn btn-sm">⬆ Импорт</button>
            </div>
          </form>
        </dialog>
      </div>
      <div class="card-body list">
        <a th:each="campaign : ${campaigns}" th:href="@{'/campaign/' + ${campaign.id}}" class="row">
          <div class="with-avatar row-main">
            <span class="avatar pink" th:text="${#strings.substring(campaign.name, 0, 1)}">К</span>
            <div class="row-main">
              <div class="row-title" th:text="${campaign.name}">Кампания</div>
              <div class="row-meta">
                <span th:text="${systemNames[campaign.system] ?: campaign.system}">Система</span>
                <span th:if="${campaign.currentDate != null}">📅 <span th:text="${campaign.currentDate}">дата</span></span>
                <span th:if="${campaign.characters != null}">
                  👥 <span th:text="${#lists.size(campaign.characters.?[!npc])}">0</span> перс.
                </span>
              </div>
            </div>
          </div>
          <span class="arrow">→</span>
        </a>
        <div th:if="${#lists.isEmpty(campaigns)}" class="empty">Пока нет ни одной кампании</div>
      </div>
    </section>

    <!-- Персонажи -->
    <section class="card">
      <div class="card-head">
        <h2 class="card-title"><span class="dot"></span>Мои персонажи</h2>
        <span class="badge" th:text="${#lists.size(characters)}">0</span>
      </div>
      <div class="card-body list">
        <a th:each="character : ${characters}" th:href="@{'/character/' + ${character.id}}" class="row">
          <div class="with-avatar row-main">
            <span class="avatar" th:text="${#strings.substring(character.name, 0, 1)}">П</span>
            <div class="row-main">
              <div class="row-title" th:text="${character.name}">Персонаж</div>
              <div class="row-meta" th:if="${character.campaign != null}">
                <span th:text="${character.campaign.name}">Кампания</span>
              </div>
            </div>
          </div>
          <span class="arrow">→</span>
        </a>
        <div th:if="${#lists.isEmpty(characters)}" class="empty">Пока нет ни одного персонажа</div>
      </div>
    </section>
  </div>
</main>
</body>
</html>
